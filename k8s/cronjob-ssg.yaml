apiVersion: batch/v1
kind: CronJob
metadata:
  name: grav-ssg-publish
  namespace: grav
spec:
  schedule: "0 */6 * * *"
  timeZone: "Europe/Rome"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ssg-publish
              image: lscr.io/linuxserver/grav:latest
              command: [/bin/sh, -c]
              args:
                - |
                  set -e
                  apk add --no-cache git > /dev/null 2>&1

                  # s6-overlay replaces /app/www/public/user (real dir) with symlink at runtime
                  # Since we bypass s6, do it manually
                  rm -rf /app/www/public/user
                  ln -s /config/www/user /app/www/public/user

                  GRAV_ROOT="/app/www/public"
                  OUTPUT_DIR="/config/www/user/data/persist"
                  REPO="lorenzogirardi/grav_k8s.it"
                  BRANCH="gh-pages"

                  echo "==> Running static-generator export..."
                  cd "${GRAV_ROOT}"
                  php bin/plugin static-generator page / "@root.descendants" \
                    --env=gh-pages --assets --static-assets --images --force

                  if [ ! -d "${OUTPUT_DIR}" ] || [ -z "$(ls -A ${OUTPUT_DIR})" ]; then
                    echo "ERROR: no output in ${OUTPUT_DIR}"; exit 1
                  fi

                  echo "==> Fixing asset paths for GitHub Pages subpath /grav_k8s.it ..."
                  # Two-pass BRE sed (busybox-safe, idempotent):
                  # pass 1: strip any existing prefix; pass 2: add prefix
                  find "${OUTPUT_DIR}" -name "*.html" -exec sed -i \
                    -e 's|href="/grav_k8s\.it/|href="/|g' \
                    -e 's|src="/grav_k8s\.it/|src="/|g' \
                    {} \;
                  find "${OUTPUT_DIR}" -name "*.html" -exec sed -i \
                    -e 's|href="/|href="/grav_k8s.it/|g' \
                    -e 's|src="/|src="/grav_k8s.it/|g' \
                    {} \;

                  echo "==> Pushing to ${REPO}:${BRANCH}..."
                  git config --global --add safe.directory "${OUTPUT_DIR}"
                  GIT="git -C ${OUTPUT_DIR}"
                  $GIT init
                  $GIT checkout -B "${BRANCH}" 2>/dev/null || true
                  $GIT config user.email "grav-ssg-bot@k8s.it"
                  $GIT config user.name "Grav SSG Bot"
                  $GIT add -A
                  if $GIT diff --cached --quiet; then
                    echo "Nothing changed, skipping push"
                  else
                    $GIT commit -m "SSG deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    $GIT push --force \
                      "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" \
                      HEAD:"${BRANCH}"
                  fi

                  echo "==> Done."
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grav-secrets
                      key: GITHUB_TOKEN
              volumeMounts:
                - name: grav-config
                  mountPath: /config
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: grav-config
              persistentVolumeClaim:
                claimName: grav-config
